version: '3.8'

services:
  db:
    image: postgres:15
    container_name: rootcloud_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rootcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootcloud}
      POSTGRES_DB: ${POSTGRES_DB:-root_cloud}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Только localhost: раньше порт торчал на 0.0.0.0 и база была доступна
    # из интернета. Для удалённого доступа — SSH-туннель.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - rootcloud_network
    logging: &default_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7
    container_name: rootcloud_redis
    restart: unless-stopped
    # Redis без пароля — наружу выставлять нельзя ни при каких условиях
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - rootcloud_network
    logging: *default_logging

  web:
    build: .
    container_name: rootcloud_web
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
    volumes:
      - ./migrations:/app/migrations
      - ./logs:/app/logs
    # Наружу панель ходит только через nginx (TLS). Прямой доступ на :5000
    # в обход HTTPS не нужен.
    ports:
      - "127.0.0.1:5000:5000"
    command: ["./scripts/entrypoint-web.sh"]
    networks:
      - rootcloud_network
    logging: *default_logging

  celery_worker:
    build: .
    container_name: rootcloud_celery_worker
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./logs:/app/logs
    command: ["./scripts/entrypoint-celery.sh", "worker"]
    networks:
      - rootcloud_network
    logging: *default_logging

  celery_beat:
    build: .
    container_name: rootcloud_celery_beat
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - celery_worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./logs:/app/logs
    command: ["./scripts/entrypoint-celery.sh", "beat"]
    networks:
      - rootcloud_network
    logging: *default_logging

volumes:
  postgres_data:

networks:
  rootcloud_network:
    driver: bridge