<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Root-Cloud Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f4f6f9; }
        .portal-navbar { background: #1a1d23; }
    </style>
</head>
<body>
<nav class="navbar portal-navbar navbar-dark px-3 mb-4">
    <a class="navbar-brand" href="/portal/">
        <i class="bi bi-cloud-fill text-primary"></i> Root-Cloud Portal
    </a>
    {% if session.get('portal_user_id') %}
    <a href="/portal/logout" class="btn btn-sm btn-outline-light">
        <i class="bi bi-box-arrow-right"></i> Выйти
    </a>
    {% endif %}
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
